name: Build GOAT CLIENT

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content GoatClient/GoatClient.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore GoatClient/GoatClient.csproj -r win-x64

      - name: Build
        run: dotnet build GoatClient/GoatClient.csproj -c Release -r win-x64 --no-restore

      - name: Publish (self-contained, win-x64)
        run: dotnet publish GoatClient/GoatClient.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -o publish

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/GoatClient.exe)) { throw "GoatClient.exe missing in publish output" }
          $empty = Get-ChildItem publish -Recurse -File | Where-Object Length -eq 0
          if ($empty) { $empty | ForEach-Object { Write-Host $_.FullName }; throw "0-byte files in publish output" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=..\publish" installer\GoatClient.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path artifacts\GoatClient-Setup.exe)) { throw "GoatClient-Setup.exe was not created" }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath artifacts/GoatClient-Portable.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GoatClient-Setup
          path: artifacts/GoatClient-Setup.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GoatClient-Portable
          path: artifacts/GoatClient-Portable.zip
          if-no-files-found: error
