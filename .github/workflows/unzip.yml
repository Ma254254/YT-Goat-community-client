name: ZIP automatisch entpacken

on:
  push:
    branches:
      - main  # Passe hier deinen Branch an, falls er anders heißt (z.B. master)

jobs:
  unzip-files:
    runs-on: ubuntu-latest
    steps:
      # 1. Repository auschecken, damit die hochgeladene ZIP-Datei verfügbar ist
      - name: Code herunterladen
        uses: actions/checkout@v4

      # 2. ZIP-Datei entpacken (Ersetze 'deine-datei.zip' durch den echten Namen deiner ZIP-Datei)
      - name: ZIP entpacken
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
            rm *.zip
          else
            echo "Keine ZIP-Datei gefunden."
          fi

      # 3. Die entpackten Dateien automatisch zurück ins Repository speichern
      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisch entpackte ZIP-Dateien" && git push)
