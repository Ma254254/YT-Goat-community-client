name: Build GOAT CLIENT

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # .NET 8
      # --------------------------------------------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # --------------------------------------------------
      # Restore
      # --------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore GoatClient.sln

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build
        run: dotnet build GoatClient.sln --configuration Release --no-restore

      # --------------------------------------------------
      # Publish Self-Contained Windows x64
      # --------------------------------------------------
      - name: Publish
        run: dotnet publish GoatClient/GoatClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      # --------------------------------------------------
      # Create ZIP
      # --------------------------------------------------
      - name: Create ZIP
        shell: pwsh
        run: |
          if (Test-Path "GoatClient-win-x64.zip") {
              Remove-Item "GoatClient-win-x64.zip" -Force
          }

          Compress-Archive `
            -Path "publish\*" `
            -DestinationPath "GoatClient-win-x64.zip" `
            -Force

      # --------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoatClient-Windows-x64
          path: GoatClient-win-x64.zip
          if-no-files-found: error
